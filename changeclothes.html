<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gōngzuò de guīdìng</title>
<style>
:root{
  --bg:#FFF8EE; --card:#FFFFFF; --ink:#4A4440; --muted:#8A817A;
  --mint:#CDEBDF; --mint-d:#5FAE8E; --coral:#F49A84; --coral-d:#E0735A;
  --blue:#BFE0F2; --blue-d:#5B9CC4; --yellow:#FFE7A8; --line:#EADFD2;
  --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
  line-height:1.5; min-height:100vh;
}
.app{max-width:980px;margin:0 auto;padding:16px}
ruby rt{font-size:.5em;color:var(--muted);font-weight:400;letter-spacing:0}
.vi{color:var(--muted);font-size:.85rem}
button{font:inherit;color:inherit;cursor:pointer}
.btn{
  border:none;border-radius:999px;padding:14px 32px;min-height:56px;min-width:150px;
  font-size:1.2rem;font-weight:700;background:var(--coral);color:#fff;
  box-shadow:0 4px 0 var(--coral-d);transition:transform .1s, box-shadow .1s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral-d)}
.btn.green{background:var(--mint-d);box-shadow:0 4px 0 #46896d}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn:focus-visible,.item:focus-visible,.icon-btn:focus-visible{outline:4px solid var(--blue-d);outline-offset:3px}

.screen{display:none}
.screen.active{display:block}

/* ---------- start ---------- */
.start{
  background:var(--card);border-radius:var(--radius);padding:28px 20px;text-align:center;
  box-shadow:0 6px 24px rgba(160,130,100,.12);
}
.lesson-tag{display:inline-block;background:var(--mint);border-radius:12px;padding:4px 14px;font-weight:700}
.start h1{font-size:2.1rem;margin:10px 0 0}
.subtitle{font-size:1.2rem;font-weight:700;color:var(--coral-d)}
.start .figure.hero{height:280px;margin:8px auto 4px}
.rule-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0 22px}
.chip{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-size:1rem}
.chip b{color:var(--coral-d)}
.chip.good b{color:var(--mint-d)}

/* ---------- game ---------- */
.topbar{
  position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px;
  display:flex;align-items:center;gap:12px;
}
.timer{flex:1;display:flex;align-items:center;gap:10px}
.timer-num{font-size:1.6rem;font-weight:800;min-width:64px;text-align:center;
  background:#fff;border-radius:14px;padding:2px 8px;border:2px solid var(--line)}
.timer-num.warn{color:var(--coral-d);border-color:var(--coral);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.bar{flex:1;height:16px;background:#fff;border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;width:100%;background:var(--mint-d);border-radius:99px;transition:width .1s linear}
.bar i.warn{background:var(--coral)}
.icon-btn{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:1.4rem}

.layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
.stage{
  position:relative;background:#fff;border-radius:var(--radius);
  padding:12px;box-shadow:0 6px 24px rgba(160,130,100,.12);text-align:center;
}
.scenario{
  background:#fff;border-radius:14px;border:2px dashed var(--line);padding:8px 12px;
  font-size:1.05rem;font-weight:700;
}
.scenario.hurt{border-color:var(--coral);background:#FFF1EC}
.scenario{display:flex;align-items:center;justify-content:center;gap:10px}
.scenario .scn-txt{text-align:left;line-height:1.35}
.figure{position:relative;height:440px;aspect-ratio:2/5;margin:6px auto 0}
.figure img,.zoom img{position:absolute;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.figure img.body,.zoom img.body{inset:0;width:100%;height:100%}
.zoom{
  position:absolute;right:10px;bottom:12px;width:132px;height:132px;border-radius:50%;
  background:#fff;border:3px solid var(--line);overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08)
}

.zoom-label{position:absolute;right:36px;bottom:146px;background:#fff;border-radius:10px;
  padding:0 8px;font-size:.85rem;border:2px solid var(--line)}
.worn-count{position:absolute;left:12px;bottom:14px;background:#fff;border-radius:12px;
  padding:4px 10px;border:2px solid var(--line);font-size:.95rem}

.panel{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 6px 24px rgba(160,130,100,.12)}
.panel h2{margin:0 0 10px;font-size:1.15rem}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.item{
  position:relative;background:var(--bg);border:3px solid transparent;border-radius:16px;
  padding:4px;aspect-ratio:1/1;min-height:72px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;transition:transform .12s, border-color .12s, background .12s;
  touch-action:manipulation;
}
.item img{width:100%;height:100%;object-fit:cover;border-radius:10px;flex:none;pointer-events:none}
.item .name{font-size:1.05rem;font-weight:700;line-height:1.1}
.item .name rt{font-size:.6em}
.item .vi{font-size:.68rem;line-height:1.1;margin-top:2px}
.item:hover{transform:translateY(-2px)}
.item.on{background:#EAF4FB;border-color:var(--blue-d)}
.item.on::after{
  content:"✓";position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;
  background:var(--blue-d);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.95rem
}
.item.res-ok{background:#E6F5EE;border-color:var(--mint-d)}
.item.res-ok::after{content:attr(data-pt);background:var(--mint-d);width:40px;border-radius:12px}
.item.res-bad{background:#FDECE7;border-color:var(--coral)}
.item.res-bad::after{content:attr(data-pt);background:var(--coral-d);width:40px;border-radius:12px}
.item.res-miss{border-color:#E9C46A;border-style:dashed}
.item.res-miss::after{content:"!";position:absolute;top:-8px;right:-8px;padding:0 7px;height:26px;border-radius:50%;
  background:#E9C46A;color:#fff;font-weight:800;display:grid;place-items:center;font-size:.85rem}
.item:disabled{cursor:default;opacity:1}
.item.dim{opacity:.45}
.done-row{display:flex;justify-content:center;margin-top:14px}

/* ---------- result ---------- */
.result-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;text-align:center}
.score-big{font-size:3rem;font-weight:900;color:var(--coral-d);line-height:1}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.stat{background:var(--bg);border-radius:12px;padding:6px 12px;font-weight:700}
.stat.ok{background:#E6F5EE;color:#3d7f63}
.stat.bad{background:#FDECE7;color:var(--coral-d)}
.stat.miss{background:#FFF4D6;color:#a07a1a}
.review{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:8px}
.review li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--bg)}
.review li .pt{flex:none;min-width:44px;text-align:center;font-weight:800;border-radius:10px;padding:2px 6px;color:#fff}
.review li.ok .pt{background:var(--mint-d)}
.review li.bad .pt{background:var(--coral-d)}
.review li.miss .pt{background:#E9C46A}
.review li .txt{font-size:1rem}
.review li .txt .vi{display:block}
.best{color:var(--muted);font-size:.95rem}
.result-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* ---------- help ---------- */
.help{margin-top:20px;background:#fff;border-radius:var(--radius);padding:16px 20px;border:2px solid var(--line)}
.help h3{margin:0 0 6px}
.help ol{margin:0;padding-left:1.3em}
.mini{width:40px;height:40px;border-radius:8px;object-fit:cover;vertical-align:middle;flex:none;border:2px solid var(--line);background:#fff}
.howto li{margin:8px 0;font-size:1.15rem;display:list-item}
.howto .row{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;vertical-align:middle}
.help li{margin:4px 0}
.kbd{display:inline-block;border:2px solid var(--line);border-bottom-width:4px;border-radius:8px;padding:0 6px;font-size:.9em;background:var(--bg)}

/* toast */
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.8);background:#fff;
  border-radius:20px;padding:16px 28px;font-size:1.6rem;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.15);
  opacity:0;pointer-events:none;transition:all .25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

@media (max-width:760px){
  .app{padding:12px 16px}
  .layout{grid-template-columns:1fr}
  #worker{height:330px;margin-right:110px}

  .zoom{width:108px;height:108px}
  .zoom-label{bottom:122px;right:26px}
  .start h1{font-size:1.7rem}
}
@media (max-width:380px){
  .grid{gap:7px}
}
</style>
</head>
<body>
<div class="app">

  <!-- ========== START ========== -->
  <section id="startScreen" class="screen active">
    <div class="start">
      <span class="lesson-tag">Dì bā kè</span>
      <h1>Gōngzuò de guīdìng</h1>
      <div class="subtitle">Huàn yīfu · yóuxì</div>
      <div class="figure hero" id="heroFig" aria-hidden="true"></div>
      <p style="font-size:1.15rem;margin:4px 0 0">Nǐ gōngzuò de shíhou, yào chuān shénme? Yào dài shénme?</p>
      <div class="rule-chips">
        <span class="chip">⏱️ <b>30</b></span>
        <span class="chip good">⭐ <b>100</b></span>
        <span class="chip">❌ <b>−10</b></span>
      </div>
      <button class="btn" id="startBtn">Wán yóuxì ▶</button>
      <p class="best" id="bestStart"></p>
    </div>
  </section>

  <!-- ========== GAME ========== -->
  <section id="gameScreen" class="screen">
    <div class="topbar">
      <div class="timer">
        <span class="timer-num" id="timeNum">30</span>
        <div class="bar"><i id="timeBar"></i></div>
      </div>
      <button class="icon-btn" id="soundBtn" aria-label="🔊">🔊</button>
    </div>

    <div class="layout">
      <div class="stage">
        <div class="scenario" id="scenario"></div>
        <div class="figure" id="worker" role="img" aria-label="Yuángōng"></div>
        <span class="zoom-label">✋ shǒu</span>
        <div class="zoom" id="handFig" aria-hidden="true"></div>
        <span class="worn-count" id="wornCount">👕 0</span>
      </div>

      <div class="panel" id="itemPanel">
        <h2 aria-hidden="true">👆 👕 ✔ &nbsp;·&nbsp; 👆 👕 ✖</h2>
        <div class="grid" id="grid"></div>
        <div class="done-row"><button class="btn green" id="doneBtn">✔ Hǎo le!</button></div>
      </div>

      <div class="panel" id="resultPanel" hidden>
        <div class="result-head">
          <div>
            <div style="font-weight:700;font-size:1.4rem">⭐</div>
            <div class="score-big" id="scoreBig">0</div>
          </div>
          <div id="resultMsg" style="font-size:1.15rem;font-weight:700"></div>
        </div>
        <div class="stats" id="stats"></div>
        <ul class="review" id="review"></ul>
        <p class="best" id="bestResult" style="text-align:center"></p>
        <div class="result-btns">
          <button class="btn" id="restartBtn" aria-label="🔄">🔄 ▶</button>
          <button class="btn ghost" id="homeBtn" aria-label="🏠">🏠</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== HELP ========== -->
  <section class="help">
    <h3>📖 Wán yóuxì</h3>
    <ol class="howto" id="howto"></ol>
  </section>
</div>

<div class="toast" id="toast"></div>

const iconSvg = id => `<img src="${ASSETS.card[id]}" alt="" draggable="false">`;
const BODY_PATCHES = ["gloves","hat","mask","necklace","uni_necklace","watch","uni_watch"];
const HAND_PATCHES = ["h_wound","h_bandage","ring","h_watch"];
const pct = (v,t) => (v/t*100).toFixed(3)+"%";
function figureMarkup(){
  return `<img class="body" data-l="body" alt="">` + BODY_PATCHES.map(k=>{
    const p=ASSETS.patch[k];
    return `<img data-p="${k}" src="${p.src}" alt="" style="left:${pct(p.x,240)};top:${pct(p.y,600)};width:${pct(p.w,240)};height:${pct(p.h,600)};display:none">`;
  }).join("");
}
function handMarkup(){
  return `<img class="body" data-l="body" alt="">` + HAND_PATCHES.map(k=>{
    const p=ASSETS.patch[k];
    return `<img data-p="${k}" src="${p.src}" alt="" style="left:${pct(p.x,300)};top:${pct(p.y,300)};width:${pct(p.w,300)};height:${pct(p.h,300)};display:none">`;
  }).join("");
}
function setFigure(root, src, on){
  const b = root.querySelector('[data-l="body"]');
  if(b.getAttribute("src")!==src) b.src = src;
  root.querySelectorAll("[data-p]").forEach(el=>el.style.display = on.includes(el.dataset.p) ? "" : "none");
}


/* ===================== HOW TO (pictures only) ===================== */
(function(){
  const im = id => `<img class="mini" src="${ASSETS.card[id]}" alt="">`;
  const rows = [
    `${im("okhand")} / ${im("wound")} 👀 Shǒu shòushāng?`,
    `👆 ${im("uniform")} → 👕 ✔ &nbsp;&nbsp; 👆 ${im("uniform")} → 👕 ✖`,
    `${im("casual")} ${im("ring")} ${im("polish")} 👀 → 👆 ✖`,
    `${im("uniform")} / ${im("casual")} → 1 &nbsp;&nbsp; ${im("cut")} / ${im("long")} / ${im("polish")} → 1`,
    `⏱️ 30 → <span class="kbd">✔ Hǎo le!</span> → ⭐ 100 &nbsp; ❌ −10 &nbsp; ⚠️ 0`,
    `⌨️ <span class="kbd">←</span> <span class="kbd">→</span> <span class="kbd">↑</span> <span class="kbd">↓</span> &nbsp; <span class="kbd">Enter</span>`,
    `✋ 🔍 → ${im("long")} ${im("ring")} ${im("wound")}`,
  ];
  document.getElementById("howto").innerHTML = rows.map(r=>`<li><span class="row">${r}</span></li>`).join("");
})();
/* ===================== STATE ===================== */
const $ = id => document.getElementById(id);
const GAME_TIME = 30;
let state = { worn:new Set(), hurt:false, running:false, endAt:0, timerId:null };
/* 6 starting situations; sentences only from L1–L8 */
const SCENARIOS = [
  {hurt:true,  start:[],                              pn:"",                                         zh:"手受傷！"},
  {hurt:false, start:[],                              pn:"Wǒ shì xīn yuángōng.",                     zh:"我是新員工。"},
  {hurt:false, start:["casual","necklace","watch"],   pn:"Wǒ zǎoshàng bā diǎn shàngbān.",            zh:"我早上八點上班。"},
  {hurt:false, start:["polish","ring","watch"],       pn:"Wǒ zuótiān fàngjià, jīntiān yào shàngbān.", zh:"我昨天放假，今天要上班。"},
  {hurt:true,  start:["casual","long","ring"],        pn:"Wǒ shì shā yú zǔ de yuángōng.",            zh:"我是殺魚組的員工。手受傷！"},
  {hurt:true,  start:["uniform","polish","necklace"], pn:"Wǒ shì shòusī zǔ de yuángōng.",            zh:"我是壽司組的員工。手受傷！"},
];
let bag = [], lastScen = -1;
function nextScenario(){
  if(!bag.length){ bag = shuffle(SCENARIOS.map((_,i)=>i)); if(bag[bag.length-1]===lastScen) bag.reverse(); }
  lastScen = bag.pop();
  return SCENARIOS[lastScen];
}
/* 100 points: not hurt 5 items x 20; hurt: uniform & OK bèng 20, others 15 */
const ptsFor = (it,s) => !s.hurt ? 20 : (it.id==="uniform"||it.id==="bandage") ? 20 : 15;
const WRONG = 10;
let soundOn = true;
let best = null;
try{ const b = localStorage.getItem("l8-dressup-best100"); if(b!==null) best = Number(b); }catch(e){}

$("worker").innerHTML = figureMarkup();
$("heroFig").innerHTML = figureMarkup();
$("handFig").innerHTML = handMarkup();
// hero: dressed correctly
setFigure($("heroFig"), ASSETS.body.uniform, ["hat","mask","gloves"]);
showBest();

function render(){
  const w = state.worn, has = id => w.has(id);
  const body = has("uniform") ? "uniform" : has("casual") ? "casual" : "base";
  const on = [];
  if(has("gloves")) on.push("gloves");
  if(has("hat")) on.push("hat");
  if(has("mask")) on.push("mask");
  if(has("necklace")) on.push(body==="uniform" ? "uni_necklace" : "necklace");
  if(has("watch")) on.push(body==="uniform" ? "uni_watch" : "watch");
  setFigure($("worker"), ASSETS.body[body], on);

  const g = has("gloves");
  const handSrc = g ? "h_glove" : has("cut") ? "h_cut" : has("long") ? "h_long" : has("polish") ? "h_polish" : "h_base";
  const hon = [];
  if(!g){
    if(state.hurt && !has("bandage")) hon.push("h_wound");
    if(has("bandage")) hon.push("h_bandage");
    if(has("ring")) hon.push("ring");
    if(has("watch")) hon.push("h_watch");
  }
  setFigure($("handFig"), ASSETS.hand[handSrc], hon);

  document.querySelectorAll(".item").forEach(b=>{
    const on = w.has(b.dataset.id);
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on);
  });
  $("wornCount").textContent = `👕 ${w.size}`;
}

/* ===================== GRID ===================== */
function rubyOf(it){
  if(it.id==="bandage") return `<ruby>OK<rt>&nbsp;</rt>蹦<rt>bèng</rt></ruby>`;
  return `<ruby>${[...it.zh].map((c,i)=>`${c}<rt>${it.py[i]||""}</rt>`).join("")}</ruby>`;
}
function buildGrid(){
  const order = shuffle(ITEMS.slice());
  $("grid").innerHTML = order.map(it=>`
    <button class="item" data-id="${it.id}" aria-pressed="false" aria-label="${it.pn}">
      ${iconSvg(it.id)}
    </button>`).join("");
}
$("grid").addEventListener("click", e=>{
  const b = e.target.closest(".item");
  if(!b || !state.running) return;
  toggle(b.dataset.id);
});

function toggle(id){
  const it = ITEMS.find(x=>x.id===id);
  if(state.worn.has(id)){
    state.worn.delete(id); blip(330);
  }else{
    if(it.slot){ ITEMS.filter(x=>x.slot===it.slot).forEach(x=>state.worn.delete(x.id)); }
    state.worn.add(id); blip(620); say(it.zh);
  }
  render();
}

/* ===================== FLOW ===================== */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active", s.id===id));
}
function startGame(){
  const scn = nextScenario();
  state.worn = new Set(scn.start);
  state.hurt = scn.hurt;
  const sc = $("scenario");
  sc.className = "scenario" + (state.hurt?" hurt":"");
  const hand = state.hurt
    ? `<img class="mini" src="${ASSETS.card.wound}" alt="">`
    : `<img class="mini" src="${ASSETS.card.okhand}" alt="">`;
  const lines = [scn.pn, state.hurt ? "<b>Shǒu shòushāng!</b>" : (scn.pn ? "" : "✋ 👍")].filter(Boolean);
  sc.innerHTML = `${hand}<span class="scn-txt">${lines.join("<br>")}</span>`;
  if(scn.zh) setTimeout(()=>say(scn.zh), 250);
  buildGrid();
  $("itemPanel").hidden = false;
  $("resultPanel").hidden = true;
  document.querySelectorAll(".item").forEach(b=>b.disabled=false);
  render();
  show("gameScreen");
  window.scrollTo({top:0});
  state.running = true;
  state.endAt = performance.now() + GAME_TIME*1000;
  clearInterval(state.timerId);
  state.timerId = setInterval(tick, 100);
  tick();
  toast("⏱️ 30");
  setTimeout(()=>{ const f=document.querySelector(".item"); if(f) f.focus({preventScroll:true}); }, 50);
}
function tick(){
  const left = Math.max(0, state.endAt - performance.now());
  const sec = Math.ceil(left/1000);
  const num = $("timeNum"), bar = $("timeBar");
  num.textContent = sec;
  bar.style.width = (left/(GAME_TIME*1000)*100) + "%";
  const warn = sec <= 5;
  num.classList.toggle("warn", warn && state.running);
  bar.classList.toggle("warn", warn);
  if(left <= 0 && state.running) finish(true);
}
function finish(timeUp){
  state.running = false;
  clearInterval(state.timerId);
  $("timeNum").classList.remove("warn");
  if(timeUp){ toast("⏰"); chord([523,392,330]); }
  else { toast("👀"); }
  showResult();
}

function showResult(){
  const s = {hurt:state.hurt};
  const rows = []; let score = 0, ok=0, bad=0, miss=0;
  ITEMS.forEach(it=>{
    const worn = state.worn.has(it.id);
    const btn = document.querySelector(`.item[data-id="${it.id}"]`);
    btn.disabled = true;
    btn.classList.remove("on","res-ok","res-bad","res-miss","dim");
    if(worn){
      if(it.ok(s)){ const p=ptsFor(it,s); score+=p; ok++; btn.classList.add("res-ok"); btn.dataset.pt="+"+p; rows.push({cls:"ok",pt:"+"+p,it,msg:it.yes}); }
      else { score-=WRONG; bad++; btn.classList.add("res-bad"); btn.dataset.pt="−"+WRONG; rows.push({cls:"bad",pt:"−"+WRONG,it,msg:it.no}); }
    }else if(it.required && it.required(s)){
      miss++; btn.classList.add("res-miss"); rows.push({cls:"miss",pt:"0",it,msg:it.yes});
    }else{
      btn.classList.add("dim");
    }
  });
  const orderCls={bad:0,miss:1,ok:2};
  rows.sort((a,b)=>orderCls[a.cls]-orderCls[b.cls]);

  score = Math.max(0, score);
  $("scoreBig").textContent = score;
  const maxScore = 100;
  let msg;
  if(score===maxScore && bad===0) msg = "🎉🎉🎉";
  else if(score >= maxScore/2) msg = "😊👍";
  else msg = "💪🔄";
  $("resultMsg").innerHTML = msg + `<div class="vi">/ ${maxScore}</div>`;
  $("stats").innerHTML =
    `<span class="stat ok">✅ ${ok}</span><span class="stat bad">❌ ${bad}</span><span class="stat miss">⚠️ ${miss}</span>`;
  $("review").innerHTML = rows.length ? rows.map(r=>`
    <li class="${r.cls}"><span class="pt">${r.pt}</span>
      <img class="mini" src="${ASSETS.card[r.it.id]}" alt=""><span class="txt"><b>${r.it.pn}</b>${r.cls==="miss"?" ⚠️":""}<br>${r.it.id==="bandage"&&r.cls==="bad" ? `<img class="mini" src="${ASSETS.card.okhand}" alt=""> ✋👍 → ❌ OK bèng` : r.msg}</span></li>`).join("")
    : `<li class="miss"><span class="pt">0</span><span class="txt">👕 0 🤷</span></li>`;

  if(best===null || score>best){ best=score; try{localStorage.setItem("l8-dressup-best100", String(best));}catch(e){} }
  showBest();
  $("itemPanel").hidden = true;
  $("resultPanel").hidden = false;
  // keep item grid visible as review: move the grid into result panel view
  $("resultPanel").insertBefore($("grid"), $("bestResult"));
  if(score===maxScore && bad===0) chord([523,659,784,1047]);
  setTimeout(()=>{ $("restartBtn").focus({preventScroll:true}); },60);
  if(window.matchMedia("(max-width:760px)").matches){
    $("resultPanel").scrollIntoView({behavior:"smooth",block:"start"});
  }
}
function showBest(){
  const t = best===null ? "" : `🏆 ${best}`;
  $("bestStart").textContent = t; $("bestResult").textContent = t;
}
function resetGridHome(){
  // put grid back in the item panel
  $("itemPanel").insertBefore($("grid"), $("itemPanel").querySelector(".done-row"));
}

$("startBtn").addEventListener("click", ()=>{ unlockAudio(); startGame(); });
$("doneBtn").addEventListener("click", ()=>{ if(state.running) finish(false); });
$("restartBtn").addEventListener("click", ()=>{ resetGridHome(); startGame(); });
$("homeBtn").addEventListener("click", ()=>{ resetGridHome(); show("startScreen"); $("startBtn").focus(); });
$("soundBtn").addEventListener("click", ()=>{
  soundOn = !soundOn; $("soundBtn").textContent = soundOn ? "🔊" : "🔇";
  if(!soundOn && window.speechSynthesis) try{speechSynthesis.cancel()}catch(e){}
});

/* ===================== KEYBOARD ===================== */
document.addEventListener("keydown", e=>{
  if(!$("gameScreen").classList.contains("active") || !state.running) return;
  const keys = ["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"];
  if(!keys.includes(e.key)) return;
  e.preventDefault();
  const items = [...document.querySelectorAll("#grid .item")];
  let i = items.indexOf(document.activeElement);
  if(i<0){ items[0].focus(); return; }
  const cols = getComputedStyle($("grid")).gridTemplateColumns.split(" ").length;
  if(e.key==="ArrowRight") i=(i+1)%items.length;
  if(e.key==="ArrowLeft") i=(i-1+items.length)%items.length;
  if(e.key==="ArrowDown") i=Math.min(items.length-1,i+cols);
  if(e.key==="ArrowUp") i=Math.max(0,i-cols);
  items[i].focus();
});

/* ===================== SOUND ===================== */
let actx=null;
function unlockAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
function blip(f, d=0.09, delay=0){
  if(!soundOn || !actx) return;
  try{
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
function chord(fs){ fs.forEach((f,i)=>blip(f,0.18,i*0.12)); }
function say(text){
  if(!soundOn || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace("OK蹦","OK繃"));
    u.lang = "zh-TW"; u.rate = 0.95;
    const v = speechSynthesis.getVoices().find(v=>/zh[-_]TW/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ===================== UTIL ===================== */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
let toastT;
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1100); }
})();
</script>
